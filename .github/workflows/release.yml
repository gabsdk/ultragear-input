name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  guard:
    name: Check tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the tag on main and matching VERSION
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME"

  build:
    needs: guard
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "UltraGear Input ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
