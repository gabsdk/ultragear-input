name: Release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: ultragear-input-*
          path: assets
          merge-multiple: true

      - name: Verify source, packages and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py assets
